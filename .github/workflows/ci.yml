name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Workspace packages export generated dist files; build dependencies before checking consumers.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: true
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install verified Foundry release
        run: |
          curl --fail --silent --show-error --location https://github.com/foundry-rs/foundry/releases/download/v1.8.3/foundry_v1.8.3_linux_amd64.tar.gz --output "$RUNNER_TEMP/foundry.tar.gz"
          printf '7ca48e6ca3cac1bce1403ca67e5bc1dc3bc1fd818199c9957c7165079c228568  %s\n' "$RUNNER_TEMP/foundry.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/foundry.tar.gz" -C "$RUNNER_TEMP" forge anvil
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: forge fmt --check
        working-directory: contracts
      - run: bash contracts/scripts/test-contracts.sh
      - name: Verify generated contract ABI
        run: node scripts/generate-abi.mjs && git diff --exit-code -- packages/sdk/src/abi.ts
      - name: Verify transaction retry journal on disposable Anvil
        run: ACT_ANVIL_BIN="$RUNNER_TEMP/anvil" node scripts/test-transaction-journal.mjs
