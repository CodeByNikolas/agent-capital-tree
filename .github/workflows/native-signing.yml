name: Native signing
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-capital:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @agent-capital-tree/sdk build && pnpm --filter @agent-capital-tree/multibaas build && pnpm --filter @agent-capital-tree/plugin build && pnpm --filter @agent-capital-tree/runtime build
      - name: Native key storage, signing, onboarding and recovery
        run: node --test packages/runtime/test/keys.test.mjs packages/runtime/test/capital.test.mjs packages/runtime/test/capital-session.test.mjs packages/runtime/test/native-signing.test.mjs
      - name: Packaged MCP and system browser contract
        run: pnpm --filter @agent-capital-tree/plugin test
